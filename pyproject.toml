[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edm2"
version = "3.1.0"
description = "EDM2: Analyzing and Improving the Training Dynamics of Diffusion Models (v2-convention refresh: unified CLI, EMA-only .pt snapshots, HDF5 class-batch generation, combra metrics)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC BY-NC-SA 4.0" }
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.26.3",
    "accelerate>=0.27.2",
    "click>=8.0",
    "numpy>=1.24.0",
    "Pillow>=9.0",
    "scipy>=1.10.0",
    "tensorboard>=2.14.0",
    "psutil>=5.9.0",
    "tqdm>=4.64.1",
    "requests>=2.28.0",
    "pyspng>=0.1.1",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]
# Optional: enables combra.metrics during training-time eval and the
# sampler-vs-steps comparison. Training runs unchanged without it (the import is
# guarded).
#
# The [metrics] extra is REQUIRED, not optional: combra 0.5.0 moved torch,
# torchvision, pytorch-fid and open-clip-torch out of its base dependencies, so a
# bare `combra` install has no FID / CMMD / FD-DINOv2 backend and those three
# metrics come back nan. combra also floors Python at 3.12, which is why this
# package does too.
#
# combra is a private repo -- cloning requires GitHub auth. If you are logged in
# via the GitHub CLI (`gh auth login`, HTTPS protocol), git inherits gh's
# credential helper and the clone works automatically:
#     pip install -e '.[combra]'
combra = [
# Pinned to a combra tag, not a moving branch. Unpinned, every fresh env
# resolved whatever combra main was that day, so the FID / CMMD / FD-DINOv2 /
# angle numbers a run is judged on could change with no signal and no record.
# Local development is unaffected -- the model envs carry an editable install of
# combra that shadows this URL; the pin governs fresh installs (cluster, CI).
# Bump it deliberately when you want combra's newer behaviour.
    "combra[metrics] @ git+https://github.com/dkagramanyan/combra.git@v0.10.0",
]

# Console entry-points. After `pip install -e .` these are available on PATH.
# (For distributed sampling use `torchrun ... sample_images.py` instead, since
# torchrun launches the script itself.)
[project.scripts]
edm2-train = "train_edm2:main"
edm2-gen-images = "generate_images:cmdline"
edm2-sample = "sample_images:cmdline"
edm2-eval = "calculate_metrics:cmdline"
edm2-prepare-data = "dataset_tool:cmdline"
edm2-download-models = "download_models:main"
edm2-compare-samplers = "compare_samplers:main"

[tool.setuptools]
py-modules = [
    "train_edm2",
    "generate_images",
    "sample_images",
    "calculate_metrics",
    "dataset_tool",
    "download_models",
    "compare_samplers",
    "count_flops",
    "reconstruct_phema",
    "toy_example",
]

[tool.setuptools.packages.find]
include = ["dnnlib*", "torch_utils*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pragmatic set for a research codebase: pyflakes (F) and import sorting (I).
select = ["F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
